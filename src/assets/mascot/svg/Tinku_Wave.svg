<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 2000">
  <style>
    .ink { stroke: #1d2b44; stroke-linecap: round; stroke-linejoin: round; }
    .out { stroke-width: 26; }
    .mid { stroke-width: 18; }
    .thin { stroke-width: 13; }
    @keyframes tinku-wave {
      0%, 100% { transform: rotate(0deg); }
      22% { transform: rotate(-13deg); }
      46% { transform: rotate(5deg); }
      70% { transform: rotate(-10deg); }
    }
    @keyframes tinku-trunk-bob {
      0%, 100% { transform: rotate(0deg); }
      45% { transform: rotate(3deg); }
    }
    @keyframes tinku-ear-l {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-2.6deg); }
    }
    @keyframes tinku-ear-r {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(2.6deg); }
    }
    @keyframes tinku-blink {
      0%, 44%, 50%, 100% { transform: scaleY(0); }
      47% { transform: scaleY(1); }
    }
    @keyframes tinku-spark-pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }
    @keyframes tinku-glint {
      0%, 100% { opacity: 0.45; transform: scale(0.86); }
      50% { opacity: 1; transform: scale(1.14); }
    }
    .wave-arm { transform-origin: 735px 1075px; animation: tinku-wave 1.9s ease-in-out infinite; }
    .trunk-grp { transform-origin: 940px 710px; animation: tinku-trunk-bob 2.4s ease-in-out infinite; }
    .ear-l { transform-origin: 735px 580px; animation: tinku-ear-l 2.8s ease-in-out infinite; }
    .ear-r { transform-origin: 1275px 580px; animation: tinku-ear-r 2.8s ease-in-out infinite; }
    .blink-l { transform-origin: 835px 606px; animation: tinku-blink 4.2s ease-in-out infinite; }
    .blink-r { transform-origin: 1145px 606px; animation: tinku-blink 4.2s ease-in-out infinite; }
    .spark-grp { transform-origin: 1055px 1270px; animation: tinku-spark-pulse 2.2s ease-in-out infinite; }
    .glint-a { transform-origin: 345px 410px; animation: tinku-glint 2.1s ease-in-out infinite; }
    .glint-b { transform-origin: 485px 315px; animation: tinku-glint 2.5s ease-in-out 0.6s infinite; }
    .glint-c { transform-origin: 1215px 1110px; animation: tinku-glint 2.3s ease-in-out 0.3s infinite; }
    @media (prefers-reduced-motion: reduce) {
      .wave-arm, .trunk-grp, .ear-l, .ear-r, .blink-l, .blink-r, .spark-grp, .glint-a, .glint-b, .glint-c {
        animation: none;
      }
      .blink-l, .blink-r { opacity: 0; }
    }
  </style>

  <defs>
    <radialGradient id="gnd" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1d2b44" stop-opacity="0.22" />
      <stop offset="72%" stop-color="#1d2b44" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#1d2b44" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="coat" x1="700" y1="880" x2="1280" y2="1760" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#bad2e3" />
      <stop offset="52%" stop-color="#95b1c5" />
      <stop offset="100%" stop-color="#7894aa" />
    </linearGradient>
    <linearGradient id="headCoat" x1="740" y1="310" x2="1230" y2="960" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c6ddeb" />
      <stop offset="55%" stop-color="#9bb6ca" />
      <stop offset="100%" stop-color="#819db2" />
    </linearGradient>
    <linearGradient id="earOuter" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#bfd6e6" />
      <stop offset="100%" stop-color="#86a2b7" />
    </linearGradient>
    <linearGradient id="earPeach" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#ffd9b6" />
      <stop offset="55%" stop-color="#fba66d" />
      <stop offset="100%" stop-color="#ea844f" />
    </linearGradient>
    <linearGradient id="belly" x1="990" y1="1045" x2="990" y2="1560" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e5f2fa" />
      <stop offset="100%" stop-color="#c9e0f0" />
    </linearGradient>
    <radialGradient id="cheek" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fb8c6f" stop-opacity="0.82" />
      <stop offset="70%" stop-color="#fb8c6f" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#fb8c6f" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="sparkHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff4a8" stop-opacity="0.96" />
      <stop offset="48%" stop-color="#ffd84d" stop-opacity="0.50" />
      <stop offset="100%" stop-color="#ffd84d" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="sparkOuter" x1="920" y1="1100" x2="1190" y2="1430" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffe97a" />
      <stop offset="55%" stop-color="#ffca28" />
      <stop offset="100%" stop-color="#ef9200" />
    </linearGradient>
    <linearGradient id="sparkInner" x1="960" y1="1150" x2="1140" y2="1370" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fffce3" />
      <stop offset="100%" stop-color="#ffdf5d" />
    </linearGradient>
  </defs>

  <!-- Ground shadow -->
  <ellipse cx="1015" cy="1812" rx="415" ry="45" fill="url(#gnd)" />

  <!-- Tail -->
  <g>
    <path d="M 1295 1475 C 1368 1506, 1438 1495, 1488 1444" fill="none" class="ink out" />
    <path d="M 1295 1475 C 1368 1506, 1438 1495, 1488 1444" fill="none" stroke="#86a0b5" stroke-width="14" stroke-linecap="round" />
    <path d="M 1474 1455 C 1484 1392, 1544 1362, 1570 1345 C 1584 1412, 1556 1478, 1494 1480 Z" fill="#637b92" class="ink mid" />
    <path d="M 1494 1444 C 1507 1408, 1534 1388, 1552 1375" fill="none" stroke="#9eb7ca" stroke-width="9" stroke-linecap="round" />
  </g>

  <!-- Left Ear (viewer left — tucked warmly so raised trunk waves clearly outside it) -->
  <g class="ear-l">
    <path d="M 815 415 C 705 278, 528 332, 495 512 C 472 638, 535 778, 655 832 C 718 858, 772 820, 795 755 Z" fill="url(#earOuter)" class="ink out" />
    <path d="M 780 468 C 695 378, 572 422, 552 548 C 538 645, 588 748, 678 786 C 722 805, 760 772, 775 722 Z" fill="url(#earPeach)" />
    <path d="M 772 485 C 708 420, 615 442, 585 518 C 638 475, 712 488, 762 542 Z" fill="#e17c49" opacity="0.55" />
    <path d="M 712 362 C 625 344, 548 398, 524 482" fill="none" stroke="#e6f3fc" stroke-width="13" stroke-linecap="round" opacity="0.72" />
  </g>

  <!-- Right Ear (viewer right — expressive floppy S-curve elephant ear) -->
  <g class="ear-r">
    <path d="M 1225 435 C 1358 308, 1545 365, 1632 548 C 1692 672, 1612 785, 1532 868 C 1468 935, 1368 955, 1295 872 Z" fill="url(#earOuter)" class="ink out" />
    <path d="M 1265 492 C 1372 398, 1505 448, 1568 582 C 1608 668, 1548 758, 1485 825 C 1435 876, 1358 888, 1308 822 Z" fill="url(#earPeach)" />
    <path d="M 1278 510 C 1358 442, 1465 475, 1515 558 C 1445 508, 1352 518, 1292 578 Z" fill="#e17c49" opacity="0.55" />
    <path d="M 1332 392 C 1432 378, 1525 438, 1575 528" fill="none" stroke="#e6f3fc" stroke-width="14" stroke-linecap="round" opacity="0.68" />
  </g>

  <!-- Waving Right Arm (viewer left) -->
  <g class="wave-arm">
    <path d="M 775 1035 C 648 1025, 512 972, 442 882 C 398 825, 436 748, 508 752 C 572 756, 636 822, 758 892 Z" fill="url(#coat)" class="ink out" />
    <path d="M 512 774 C 565 782, 624 832, 705 882" fill="none" stroke="#dfeef8" stroke-width="14" stroke-linecap="round" opacity="0.75" />
    <ellipse cx="452" cy="842" rx="22" ry="15" transform="rotate(-28 452 842)" fill="#fff4dc" class="ink thin" />
    <ellipse cx="474" cy="796" rx="22" ry="15" transform="rotate(-12 474 796)" fill="#fff4dc" class="ink thin" />
    <ellipse cx="515" cy="768" rx="20" ry="14" transform="rotate(10 515 768)" fill="#fff4dc" class="ink thin" />
    <path d="M 372 795 C 358 752, 375 705, 412 678" fill="none" stroke="#7da2c2" stroke-width="12" stroke-linecap="round" opacity="0.55" />
    <path d="M 332 815 C 315 758, 336 692, 385 655" fill="none" stroke="#7da2c2" stroke-width="10" stroke-linecap="round" opacity="0.35" />
  </g>

  <!-- Plump Body & Legs (smoothly sloped shoulders tucked cleanly beneath the head — zero shelf) -->
  <g>
    <path d="M 835 885
             C 712 965, 642 1185, 678 1398
             C 694 1474, 705 1614, 698 1728
             C 694 1768, 728 1790, 822 1790
             C 918 1790, 948 1768, 952 1722
             L 962 1595
             C 995 1602, 1032 1602, 1065 1595
             L 1078 1722
             C 1082 1768, 1115 1790, 1210 1790
             C 1304 1790, 1338 1768, 1334 1728
             C 1326 1608, 1336 1475, 1352 1398
             C 1386 1188, 1312 968, 1185 885 Z"
          fill="url(#coat)" class="ink out" />

    <!-- Subtle inner leg & side core shading -->
    <path d="M 962 1588 C 942 1588, 912 1635, 912 1768 L 948 1760 L 962 1595 Z" fill="#6d889e" opacity="0.55" />
    <path d="M 1282 1390 C 1270 1515, 1272 1645, 1280 1772 L 1325 1758 C 1320 1630, 1326 1495, 1342 1395 Z" fill="#6d889e" opacity="0.48" />

    <!-- Clean rounded tummy patch -->
    <ellipse cx="1002" cy="1312" rx="228" ry="244" fill="url(#belly)" />
    <path d="M 822 1182 C 868 1092, 968 1060, 1068 1080" fill="none" stroke="#f5fbff" stroke-width="12" stroke-linecap="round" opacity="0.72" />

    <!-- Knee dimples -->
    <path d="M 775 1642 Q 822 1658 868 1642" fill="none" stroke="#6a859b" stroke-width="12" stroke-linecap="round" />
    <path d="M 1158 1642 Q 1205 1658 1252 1642" fill="none" stroke="#6a859b" stroke-width="12" stroke-linecap="round" />

    <!-- Left foot toenails -->
    <path d="M 728 1784 C 728 1732, 778 1732, 778 1784 Z" fill="#fff4dc" class="ink mid" />
    <path d="M 796 1788 C 796 1730, 850 1730, 850 1788 Z" fill="#fff4dc" class="ink mid" />
    <path d="M 868 1784 C 868 1734, 916 1734, 916 1784 Z" fill="#fff4dc" class="ink mid" />

    <!-- Right foot toenails -->
    <path d="M 1116 1784 C 1116 1734, 1164 1734, 1164 1784 Z" fill="#fff4dc" class="ink mid" />
    <path d="M 1182 1788 C 1182 1730, 1236 1730, 1236 1788 Z" fill="#fff4dc" class="ink mid" />
    <path d="M 1254 1784 C 1254 1732, 1304 1732, 1304 1784 Z" fill="#fff4dc" class="ink mid" />
  </g>

  <!-- Radiant 3D Golden Spark Star (symbol-free for ages 6-8) -->
  <g class="spark-grp">
    <circle cx="1055" cy="1272" r="245" fill="url(#sparkHalo)" />
    <path d="M 1046 1092
             L 1100 1189
             L 1209 1205
             L 1130 1283
             L 1149 1393
             L 1050 1342
             L 952 1395
             L 970 1285
             L 890 1209
             L 998 1191 Z"
          fill="url(#sparkOuter)" stroke="#b4690e" stroke-width="20" stroke-linejoin="round" stroke-linecap="round" />
    <path d="M 1047 1139
             L 1084 1207
             L 1160 1219
             L 1105 1273
             L 1118 1349
             L 1050 1313
             L 982 1350
             L 994 1274
             L 939 1221
             L 1014 1208 Z"
          fill="url(#sparkInner)" />
    <ellipse cx="1016" cy="1219" rx="28" ry="12" transform="rotate(-28 1016 1219)" fill="#ffffff" opacity="0.92" />
    <circle cx="1062" cy="1195" r="9" fill="#ffffff" opacity="0.88" />
  </g>

  <!-- Cradling Left Arm (viewer right — seamless shoulder fill + open outer contour) -->
  <g>
    <path d="M 1245 995
             C 1388 1072, 1422 1238, 1334 1332
             C 1274 1394, 1170 1396, 1124 1340
             C 1094 1304, 1112 1246, 1164 1236
             C 1206 1228, 1242 1186, 1216 1112 Z"
          fill="url(#coat)" />
    <path d="M 1284 1012
             C 1392 1086, 1420 1240, 1334 1332
             C 1274 1394, 1170 1396, 1124 1340
             C 1094 1304, 1112 1246, 1164 1236
             C 1204 1228, 1238 1190, 1218 1124"
          fill="none" class="ink out" />
    <path d="M 1308 1068 C 1356 1130, 1364 1216, 1320 1282" fill="none" stroke="#dfeef8" stroke-width="13" stroke-linecap="round" opacity="0.65" />
    <ellipse cx="1136" cy="1268" rx="20" ry="13" transform="rotate(-15 1136 1268)" fill="#fff4dc" class="ink thin" />
    <ellipse cx="1134" cy="1306" rx="20" ry="13" transform="rotate(6 1134 1306)" fill="#fff4dc" class="ink thin" />
    <ellipse cx="1152" cy="1342" rx="19" ry="12" transform="rotate(24 1152 1342)" fill="#fff4dc" class="ink thin" />
  </g>

  <!-- Head + Hair Crest -->
  <g>
    <ellipse cx="1010" cy="990" rx="215" ry="46" fill="#6a859b" opacity="0.42" />

    <path d="M 942 342
             C 925 295, 958 272, 995 312
             C 992 258, 1042 248, 1068 308
             C 1088 282, 1122 298, 1104 345
             C 1268 382, 1368 518, 1358 688
             C 1348 858, 1212 978, 1005 978
             C 798 978, 662 858, 652 688
             C 642 518, 755 375, 942 342 Z"
          fill="url(#headCoat)" class="ink out" />

    <path d="M 732 515 C 775 418, 868 368, 965 362" fill="none" stroke="#eaf5fc" stroke-width="18" stroke-linecap="round" opacity="0.8" />
    <path d="M 745 848 C 842 948, 1168 952, 1282 835 C 1222 935, 822 940, 745 848 Z" fill="#6f8ba1" opacity="0.42" />

    <!-- Rosy cheeks -->
    <ellipse cx="772" cy="706" rx="68" ry="44" fill="url(#cheek)" />
    <ellipse cx="1212" cy="706" rx="68" ry="44" fill="url(#cheek)" />

    <!-- Playful arched eyebrows -->
    <path d="M 782 496 Q 828 468 874 492" fill="none" stroke="#1d2b44" stroke-width="22" stroke-linecap="round" />
    <path d="M 1106 492 Q 1152 468 1198 496" fill="none" stroke="#1d2b44" stroke-width="22" stroke-linecap="round" />

    <!-- Left Eye + Catchlights -->
    <path d="M 788 575 Q 766 562 760 546" fill="none" stroke="#1d2b44" stroke-width="14" stroke-linecap="round" />
    <ellipse cx="835" cy="606" rx="48" ry="58" fill="#18253c" />
    <path d="M 800 628 A 42 46 0 0 0 870 628 A 42 32 0 0 1 800 628 Z" fill="#314e7c" opacity="0.75" />
    <circle cx="818" cy="584" r="18" fill="#ffffff" />
    <circle cx="852" cy="628" r="8" fill="#ffffff" opacity="0.9" />
    <ellipse class="blink-l" cx="835" cy="606" rx="52" ry="62" fill="url(#headCoat)" stroke="#1d2b44" stroke-width="14" />

    <!-- Right Eye + Catchlights -->
    <path d="M 1192 575 Q 1214 562 1220 546" fill="none" stroke="#1d2b44" stroke-width="14" stroke-linecap="round" />
    <ellipse cx="1145" cy="606" rx="48" ry="58" fill="#18253c" />
    <path d="M 1110 628 A 42 46 0 0 0 1180 628 A 42 32 0 0 1 1110 628 Z" fill="#314e7c" opacity="0.75" />
    <circle cx="1128" cy="584" r="18" fill="#ffffff" />
    <circle cx="1162" cy="628" r="8" fill="#ffffff" opacity="0.9" />
    <ellipse class="blink-r" cx="1145" cy="606" rx="52" ry="62" fill="url(#headCoat)" stroke="#1d2b44" stroke-width="14" />

    <!-- Warm delighted smile & dimple -->
    <path d="M 945 778 Q 1048 862 1126 765" fill="none" class="ink out" />
    <path d="M 1112 748 Q 1142 758 1146 785" fill="none" class="ink mid" />

    <!-- Upward-curling cheerful trunk (arching cleanly into open sky space to the left!) -->
    <g class="trunk-grp">
      <!-- Seamless gradient fill first, then open outer outline so bridge has zero colour seam -->
      <path d="M 888 652
               C 812 732, 682 778, 578 725
               C 502 686, 478 592, 444 522
               C 425 484, 376 482, 360 518
               C 344 554, 372 602, 392 642
               C 446 752, 558 866, 708 878
               C 842 888, 965 832, 1025 738
               Q 962 632 888 652 Z"
            fill="url(#headCoat)" />
      <path d="M 888 658
               C 812 734, 682 778, 578 725
               C 502 686, 478 592, 444 522
               C 425 484, 376 482, 360 518
               C 344 554, 372 602, 392 642
               C 446 752, 558 866, 708 878
               C 842 888, 965 832, 1025 738"
            fill="none" class="ink out" />
      <ellipse cx="398" cy="518" rx="18" ry="12" transform="rotate(-26 398 518)" fill="#f89c74" class="ink thin" />
      <path d="M 858 692 C 782 764, 662 796, 562 742" fill="none" stroke="#e6f3fc" stroke-width="13" stroke-linecap="round" opacity="0.72" />
      <path d="M 848 680 Q 892 695 912 734" fill="none" stroke="#6a859b" stroke-width="13" stroke-linecap="round" />
      <path d="M 782 736 Q 825 756 838 796" fill="none" stroke="#6a859b" stroke-width="13" stroke-linecap="round" />
      <path d="M 696 770 Q 730 800 732 840" fill="none" stroke="#6a859b" stroke-width="13" stroke-linecap="round" />
    </g>
  </g>

  <!-- Floating 4-point Wonder Sparkle glints in clean open sky space -->
  <path class="glint-a" d="M 345 362 Q 349 406 393 410 Q 349 414 345 458 Q 341 414 297 410 Q 341 406 345 362 Z" fill="#ffd43b" stroke="#b4690e" stroke-width="8" stroke-linejoin="round" />
  <path class="glint-b" d="M 485 281 Q 488 312 519 315 Q 488 318 485 349 Q 482 318 451 315 Q 482 312 485 281 Z" fill="#fff3b0" stroke="#d98a16" stroke-width="7" stroke-linejoin="round" />
  <path class="glint-c" d="M 1215 1076 Q 1218 1107 1249 1110 Q 1218 1113 1215 1144 Q 1212 1113 1181 1110 Q 1212 1107 1215 1076 Z" fill="#ffe066" stroke="#b4690e" stroke-width="7" stroke-linejoin="round" />
</svg>
