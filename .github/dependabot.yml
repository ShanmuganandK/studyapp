# Dependabot configuration.
#
# WHY THIS FILE EXISTS: Dependabot's grouped bump moved `tailwindcss` to 4.x twice (2026-10-07 and again
# 2026-10-16, when an old Dependabot PR was merged after its branch had gone stale). Each time master's
# build broke ("tailwindcss moved to @tailwindcss/postcss"). v4 is a config/CSS migration, not a lockfile
# change (CLAUDE.md), so major bumps of tailwindcss are ignored until someone does that migration on purpose.
#
# Version-update PRs are switched off (open-pull-requests-limit: 0): this file only carries the ignore rule.
# Security-update PRs are separate. UNVERIFIED whether GitHub applies the `ignore` rule to security
# updates as well; if a Tailwind 4 PR appears again, comment `@dependabot ignore tailwindcss major version`
# on it and do NOT merge a Dependabot PR whose CI is red or whose branch is older than master's last commit.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: tailwindcss
        update-types: ['version-update:semver-major']
