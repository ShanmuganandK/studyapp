name: Android build

# DEBUG builds run automatically when something is merged to master (DECISIONS 2026-10-16), so a broken
# Android build is seen the moment it lands, not weeks later. RELEASE builds stay manual: they handle the
# Play upload key and cost a Play versionCode, so only a person with write access starts one
# (workflow_dispatch -> build_type = release).
#
# Why this is still safe for the key: the only automatic trigger is a push to master. A pull request,
# a fork, or any other branch can never start this workflow, and the release job (the only one that can
# read the four signing secrets, via the `android-release` environment) is skipped unless the run was
# started by hand with build_type = release. androidWorkflow.test.js asserts all of that.
#
#   push to master        -> debug APK (no secrets). Docs-only pushes are skipped.
#   build_type = debug    -> the same, started by hand (e.g. to retry).
#   build_type = release  -> a SIGNED .aab for Play (see ANDROID-RELEASE-RUNBOOK.md).
#
# The debug APK is built in ALL modes, and its permissions are MEASURED from the real merged manifest
# (aapt2), not inferred from the source manifest: this is the evidence for the Play Data Safety form.
on:
  push:
    branches: [master]
    paths-ignore:
      - '**/*.md'
      - 'design-handoff/**'
      - 'design-system/**'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'debug = test APK (no secrets); release = signed AAB for Play'
        type: choice
        options: [debug, release]
        default: debug

permissions:
  contents: read

env:
  # The ONLY permission the merged manifest may contain. AndroidX adds this app-private, signature-level
  # permission to every app; it grants no network or device access. Anything else (INTERNET, storage,
  # location...) fails the build.
  ALLOWED_PERMISSION: com.stringus.tinku.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21' # Capacitor 8's Android modules compile at Java 21 (capacitor.build.gradle); AGP 8.13 / Gradle 8.14 run on it

      # GitHub's runner image already ships the Android SDK (ANDROID_HOME). The android-actions/setup-android
      # action failed on it ("Failed to find package 'tools'"), so it is not used: accept the licences and
      # install exactly the two pieces this project needs (compileSdk/targetSdk 36 in android/variables.gradle).
      - name: Android SDK components
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install
        run: npm ci

      # Same gates as CI, so an Android artifact is never built from a tree CI would reject.
      - name: Lint, privacy page, tests
        run: |
          npm run lint
          npm run lint:hex
          npm run privacy:check
          npm run test:run

      - name: Build the Android web bundle and sync it into android/
        run: npm run build:android
        env:
          VITE_TESTER_TOOLS: 'true' # debug APKs are for testers: shows the tester tools. The release job below does not set it.

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      # MEASURE, don't infer: read the permissions out of the APK that was actually built.
      - name: Check the APK's real permissions
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          "$AAPT2" dump permissions "$APK" | tee permissions.txt
          "$AAPT2" dump badging "$APK" | grep -E "^(package|sdkVersion|targetSdkVersion)" | tee badging.txt
          FOUND=$(grep -oE "uses-permission[^:]*: name='[^']+'" permissions.txt | sed -E "s/.*name='([^']+)'/\1/" | sort -u)
          UNEXPECTED=$(echo "$FOUND" | grep -vxF "$ALLOWED_PERMISSION" | grep -v '^$' || true)
          {
            echo "### Measured APK permissions"
            echo '```'
            cat permissions.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$UNEXPECTED" ]; then
            echo "::error::Unexpected permission(s) in the built APK:"
            echo "$UNEXPECTED"
            exit 1
          fi

      # Informational only (never fails the build): why a phone might refuse the APK. Signature scheme and
      # certificate, 4-byte alignment and compression of resources.arsc (Android 11+ rejects an install
      # without them), the declared SDK levels, and the native ABIs (none expected: this app has no native code).
      - name: APK install diagnostics
        continue-on-error: true
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          {
            echo "### APK install diagnostics"
            echo '```'
            ls -l "$APK"
            echo "--- apksigner verify"
            "$BT"apksigner verify --verbose --print-certs "$APK" 2>&1 | grep -v "^WARNING" | head -20
            echo "--- zipalign (4-byte)"
            "$BT"zipalign -c -P 16 -v 4 "$APK" 2>&1 | tail -2
            echo "--- resources.arsc storage"
            unzip -v "$APK" resources.arsc | tail -3
            echo "--- native libs (expect none)"
            unzip -l "$APK" | grep -c "lib/" || true
            echo "--- badging"
            "$BT"aapt2 dump badging "$APK" | grep -E "^(package|sdkVersion|targetSdkVersion|compileSdkVersion|native-code)" 
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: tinku-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error

  release:
    # Only when asked for, and only after the debug build + permission check above passed.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_type == 'release' }}
    needs: debug
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The signing secrets are stored on this environment, not on the repo, so no other job can read them.
    # Add "Required reviewers" to the environment if you want a human approval click before each release.
    environment: android-release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK components
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install
        run: npm ci

      - name: Build the Android web bundle and sync it into android/
        run: npm run build:android

      - name: Decode the upload key (never printed, deleted afterwards)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set on the android-release environment. See ANDROID-RELEASE-RUNBOOK.md."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "TINKU_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build signed release AAB
        working-directory: android
        env:
          TINKU_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TINKU_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TINKU_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          TINKU_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew --no-daemon bundleRelease

      - name: Remove the decoded key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: tinku-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
          if-no-files-found: error
